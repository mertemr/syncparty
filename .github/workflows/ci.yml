name: CI

# `main` is protected and can only receive commits through a branch that has
# passed these required checks. Running the same suite again after merge adds
# no coverage and used to spend another complete CI cycle on identical code.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: Run the backend jobs
        type: boolean
        default: true
      frontend:
        description: Run the frontend job
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Cheap, and the reason it is here rather than only in the release workflow:
  # a version mismatch found at tag time has already burned the tag.
  version:
    name: Versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - run: node scripts/version.mjs check

  backend-checks:
    name: Backend (lint & types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend

    steps:
      - *checkout

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Generated types are up to date
        run: |
          if ! git diff --quiet -- src/shared/types; then
            echo "::error::src/shared/types is stale — run 'cargo test' in src-tauri and commit the result."
            git diff -- src/shared/types
            exit 1
          fi

  backend:
    name: Backend (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS

    steps:
      - *checkout

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # The only job that talks to software we did not write. Everything else
  # pins our own idea of the Syncplay protocol, which is worth nothing if that
  # idea is wrong — and hosting no longer installs a Syncplay server, so
  # nothing else would ever notice it drifting.
  compatibility:
    name: Backend (real Syncplay client)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend

    steps:
      - *checkout

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install a real Syncplay client
        run: |
          # From the archive, not pip: Syncplay is not published on PyPI, so
          # the venv this used to build could never resolve it and the job
          # failed before reaching the test.
          #
          # Ubuntu carries 1.7.0. That is older than what a developer runs,
          # and deliberately so — it is the client an LTS user would point at
          # us, which is the compatibility actually worth proving.
          sudo apt-get install --no-install-recommends -y syncplay mpv
          command -v syncplay

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Prove a real client still works
        working-directory: src-tauri
        run: cargo test --test syncplay_compatibility -- --ignored

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.frontend

    steps:
      - *checkout

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
