name: CI

# `main` is protected and can only receive commits through a branch that has
# passed these required checks. Running the same suite again after merge adds
# no coverage and used to spend another complete CI cycle on identical code.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: Run the backend jobs
        type: boolean
        default: true
      frontend:
        description: Run the frontend job
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Cheap, and the reason it is here rather than only in the release workflow:
  # a version mismatch found at tag time has already burned the tag.
  version:
    name: Versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - run: node scripts/version.mjs check

  backend-checks:
    name: Backend (lint & types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend

    steps:
      - *checkout

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # `git status` rather than `git diff`: a type exported for the first time
      # lands as an untracked file, which `git diff` does not see, so a PR that
      # forgot to commit one would pass here with the frontend missing a type
      # the backend now sends.
      - name: Generated types are up to date
        run: |
          if [ -n "$(git status --porcelain -- src/shared/types)" ]; then
            echo "::error::src/shared/types is stale — run 'cargo test' in src-tauri and commit the result."
            git status --short -- src/shared/types
            git diff -- src/shared/types
            exit 1
          fi

  backend:
    name: Backend (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS

    steps:
      - *checkout

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # Our server, our client and a real mpv, end to end. Both ends of the
  # protocol are ours now, so this cannot notice our idea of Syncplay drifting
  # from upstream's — the captured-message tests in protocol.rs are what pin
  # that. What it catches is everything those cannot: a real player behind a
  # real IPC socket, and playback state actually crossing the server.
  #
  # The test makes its own clip with `mpv --o`, so mpv is the only thing it
  # needs beyond what the crate needs to build. The second step runs the mpv
  # driver's own ignored tests, which want a real player for the same reason.
  #
  # Its own job rather than steps in `backend-checks`, and not a required
  # check, so a player that misbehaves on a runner image does not lock every
  # merge while this is new.
  native-e2e:
    name: Backend (native client + mpv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend

    steps:
      - *checkout

      # mpv runs headless (`--vo=null --ao=null`), so there is no Xvfb here.
      # The Tauri libraries are needed because the test links the whole crate.
      - name: Install Tauri system dependencies and mpv
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            mpv
          mpv --version

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Our server and client keep a real mpv in step
        working-directory: src-tauri
        run: cargo test --test native_watch_e2e -- --ignored

      - name: The mpv driver works against a real mpv
        working-directory: src-tauri
        run: cargo test --lib player::mpv -- --ignored

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.frontend

    steps:
      - *checkout

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
