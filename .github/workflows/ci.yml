name: CI

on:
  pull_request:
  workflow_dispatch:

# `main` is protected and can only receive commits through a branch that has
# passed these required checks. Running the same suite again after merge adds
# no coverage and used to spend another complete CI cycle on identical code.

# Neither job pushes, comments, or otherwise writes anything back — this is
# read-only by design, including for PRs from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Debug symbols are not useful in ephemeral lint/test jobs and make the
      # large Tauri dependency graph slower to compile and cache.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The frontend build output has to exist before `generate_context!`
      # will expand, even for a check that never renders anything.
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
        shell: bash

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Also regenerates src/shared/types, which the drift check below reads.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Generated types are up to date
        shell: bash
        run: |
          if ! git diff --quiet -- src/shared/types; then
            echo "::error::src/shared/types is stale — run 'cargo test' in src-tauri and commit the result."
            git diff -- src/shared/types
            exit 1
          fi

  # What the container image builds. Keeps `core` free of Tauri and the
  # keychain, and is the only leg that compiles syncpartyd's signal handling.
  headless:
    name: Headless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: headless

      # No dist/index.html needed: without Tauri there is no
      # generate_context! to satisfy.
      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --no-default-features --features headless --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --no-default-features --features headless

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
