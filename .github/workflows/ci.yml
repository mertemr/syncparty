name: CI

# `main` is protected and can only receive commits through a branch that has
# passed these required checks. Running the same suite again after merge adds
# no coverage and used to spend another complete CI cycle on identical code.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: Run the backend jobs
        type: boolean
        default: true
      frontend:
        description: Run the frontend job
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  backend-checks:
    name: Backend (lint & types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend

    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Generated types are up to date
        run: |
          if ! git diff --quiet -- src/shared/types; then
            echo "::error::src/shared/types is stale — run 'cargo test' in src-tauri and commit the result."
            git diff -- src/shared/types
            exit 1
          fi

  backend:
    name: Backend (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS

    steps:
      - *checkout

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Test
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.frontend

    steps:
      - *checkout

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
