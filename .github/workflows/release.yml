name: Release

# A tag is the single source of truth for a release. Re-running a failed job is
# still available in GitHub Actions, while a manual dispatch from `main` could
# accidentally try to publish a release named `main`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Fails before three native runners are reserved for a bad version bump.
      - name: Check tag and application versions
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "$package_version" != "$tauri_version" || "$package_version" != "$cargo_version" ]]; then
            echo "::error::Version mismatch: package.json=$package_version, tauri.conf.json=$tauri_version, Cargo.toml=$cargo_version"
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match application version v$package_version"
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - *checkout

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # TAURI_SIGNING_PRIVATE_KEY signs the *update package*, not the
      # installers — those stay unsigned. Losing it breaks auto-update only:
      # generate a new one and swap its public half into tauri.conf.json.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: syncparty ${{ github.ref_name }}
          # Stays hidden until the publish job below flips it, so a half
          # finished matrix never reaches anyone.
          releaseDraft: true
          uploadUpdaterJson: true
          releaseBody: |
            ## Install

            **Windows** — the `.exe` setup file below (or the `.msi`)
            **macOS** — `aarch64.dmg` for Apple silicon, `x64.dmg` for Intel

            Everything syncparty needs — the Syncplay client, mpv, and the
            Python environment for hosting — is checked on first launch and
            installed for you if it is missing.

            From this release on, syncparty checks for updates on startup and
            offers to install them in place — no need to come back here again.

            ## Before you open it

            These builds are unsigned. Windows SmartScreen will say "unknown
            publisher": choose **More info → Run anyway**. macOS Gatekeeper
            will refuse the first launch: **right-click the app → Open**.

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write

    steps:
      # Nothing is checked out here, so GH_REPO is what tells `gh` which
      # repository it is talking to.
      - name: Publish draft after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
