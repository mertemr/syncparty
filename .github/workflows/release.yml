name: Release

on:
  push:
    tags: ["v*"]

# A tag is the single source of truth for a release. Re-running a failed job is
# still available in GitHub Actions, while a manual dispatch from `main` could
# accidentally try to publish a release named `main`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7

      # Fail before reserving three native runners when the tag or one of the
      # three version declarations was forgotten during the release bump.
      - name: Check tag and application versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          if [[ "$package_version" != "$tauri_version" || "$package_version" != "$cargo_version" ]]; then
            echo "::error::Version mismatch: package.json=$package_version, tauri.conf.json=$tauri_version, Cargo.toml=$cargo_version"
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match application version v$package_version"
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The installers themselves are still unsigned (no Authenticode/Apple
      # Developer ID certificate) — SmartScreen and Gatekeeper will warn on
      # first run regardless. TAURI_SIGNING_PRIVATE_KEY is a separate,
      # unrelated keypair: it signs the *update package* so the in-app
      # updater can verify an update actually came from this repo's CI
      # before installing it. Losing that key would only break auto-update,
      # not the ability to cut releases — a new one can be generated and its
      # public half swapped into tauri.conf.json.
      # v1 runs on Node.js 24 and is the maintained Tauri v2 release action.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: syncparty ${{ github.ref_name }}
          # Keep the release private until every platform has uploaded its
          # installer and updater signature. The publish job below makes it
          # visible atomically after the whole matrix succeeds.
          releaseDraft: true
          # Aggregates every platform's signed artifacts into the latest.json
          # manifest the updater endpoint in tauri.conf.json points at.
          uploadUpdaterJson: true
          releaseBody: |
            ## Install

            **Windows** — the `.exe` setup file below (or the `.msi`)
            **macOS** — `aarch64.dmg` for Apple silicon, `x64.dmg` for Intel

            Everything syncparty needs — the Syncplay client, mpv, and the
            Python environment for hosting — is checked on first launch and
            installed for you if it is missing.

            From this release on, syncparty checks for updates on startup and
            offers to install them in place — no need to come back here again.

            ## Before you open it

            These builds are unsigned. Windows SmartScreen will say "unknown
            publisher": choose **More info → Run anyway**. macOS Gatekeeper
            will refuse the first launch: **right-click the app → Open**.

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write

    steps:
      - name: Publish draft after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
