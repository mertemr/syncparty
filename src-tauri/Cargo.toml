[package]
name = "syncparty"
version = "0.5.0"
description = "Synchronised movie nights, peer to peer"
authors = ["Taha Çeken", "Mert Emir <48881002+mertemr@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Tahckn/syncparty"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which would otherwise collide on Windows.
name = "syncparty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "process",
    "fs",
] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
# Pinned to 3.x: keyring 4 moved to a different backend API, and 3.x is the
# line with the stable Entry interface used in core::config::secrets.
#
# `sync-secret-service` is what makes Linux work at all. Without a backend
# feature matching the target, keyring silently falls back to an in-memory
# mock store: it compiles, it never errors, and nothing survives a restart —
# which on Linux meant the server salt was regenerated on every launch and
# every room operator password quietly stopped working.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
base64 = "0.23"
md-5 = "0.10"
# Controlled-room names hash the salt and password through `sha1` and `sha2`.
# Same RustCrypto family as md-5, so the `Digest` usage matches.
sha1 = "0.10"
# `sha2` also verifies the pinned Syncplay source archive after download. The
# tarball is fetched over TLS from GitHub, but TLS only proves who served the
# bytes, not that they are the bytes this release was tested against.
sha2 = "0.10"
# rustls rather than the platform TLS stack, so the same certificate
# behaviour ships on Windows and macOS.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls",
    "webpki-roots",
] }
ts-rs = "12"
which = "8"
getrandom = "0.4"
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# The transport a party runs over: QUIC between two ed25519 keys, hole punched
# where the network allows and relayed where it does not. Pinned to the 1.x
# line, which is the first with a stability guarantee — and which is also why
# the 0.35 relays, retired at the end of 2026, are not a concern here.
iroh = "1.0.3"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
