[package]
name = "syncparty"
version = "0.3.2"
description = "Synchronised movie nights over Tailscale"
authors = ["Taha Çeken"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Tahckn/syncparty"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which would otherwise collide on Windows.
name = "syncparty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Declared explicitly rather than inferred, so each build shape only compiles
# the binary it can link.
[[bin]]
name = "syncparty"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "syncpartyd"
path = "src/bin/syncpartyd.rs"
required-features = ["headless"]

[features]
default = ["desktop"]

# `keyring` belongs here because the OS keychain is a desktop-session facility;
# the headless build keeps its secrets in a file instead.
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-store",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    "dep:keyring",
]

headless = []

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "process",
    "fs",
    # `syncpartyd` unwinds on SIGTERM, which is what `docker stop` sends.
    "signal",
] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
# Pinned to 3.x: keyring 4 moved to a different backend API, and 3.x is the
# line with the stable Entry interface used in core::config::secrets.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
], optional = true }
base64 = "0.23"
md-5 = "0.10"
# rustls rather than the platform TLS stack, so the same certificate
# behaviour ships on Windows and macOS.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls",
    "webpki-roots",
] }
ts-rs = "12"
which = "8"
getrandom = "0.4"
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = [
    "deep-link",
], optional = true }
