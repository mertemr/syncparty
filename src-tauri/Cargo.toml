[package]
name = "syncparty"
version = "0.6.0"
description = "Synchronised movie nights, peer to peer"
authors = ["Taha Çeken", "Mert Emir <48881002+mertemr@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Tahckn/syncparty"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which would otherwise collide on Windows.
name = "syncparty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "process",
    "fs",
] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
# Pinned to 3.x: keyring 4 moved to a different backend API, and 3.x is the
# line with the stable Entry interface used in core::config::secrets.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.23"
md-5 = "0.10"
# rustls rather than the platform TLS stack, so the same certificate
# behaviour ships on Windows and macOS.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "query",
    "rustls",
    "webpki-roots",
] }
ts-rs = "12"
# "bundled" compiles SQLite in rather than requiring one on the system —
# the only sane choice for a single-writer desktop app with no admin install
# step. Movie/vote history persistence in `core::movie::store`.
rusqlite = { version = "0.32", features = ["bundled"] }
which = "8"
getrandom = "0.4"
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# The transport a party runs over: QUIC between two ed25519 keys, hole punched
# where the network allows and relayed where it does not. Pinned to the 1.x
# line, which is the first with a stability guarantee — and which is also why
# the 0.35 relays, retired at the end of 2026, are not a concern here.
iroh = "1.0.3"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
